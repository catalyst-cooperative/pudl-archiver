---
name: run-fsspec-archiver

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Name of dataset to archive
        default: ferceqr
        required: true
        type: string
      deposition_path:
        description: "Specify an fsspec compatible path where archive will be created."
        type: string
        default: "gs://archives.catalyst.coop"
      create_github_issue:
        description: "Create a Github issue from this run?"
        default: false
        required: true
        type: boolean
  schedule:
    - cron: "21 8 1 * *" # 8:21 AM UTC, first of every month

jobs:
  notify-start:
    runs-on: ubuntu-latest
    outputs:
      dataset: ${{ steps.launch_message.outputs.DATASET }}
    steps:
      - name: Build launch notification
        id: launch_message
        env:
          DATASET: ${{ inputs.dataset || 'ferceqr' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          {
            echo "LAUNCH_CONTENT<<EOF"
            echo "# :rocket: Launching \`$WORKFLOW_NAME\` workflow ([view run]($RUN_URL))"
            echo
            echo "Dataset: $DATASET"
            echo "EOF"
            echo "DATASET=$DATASET"
          } >> "$GITHUB_OUTPUT"
      - name: Notify Zulip of workflow launch
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: "build-status-bot@catalyst-cooperative.zulipchat.com"
          organization-url: "https://catalyst-cooperative.zulipchat.com"
          type: "stream"
          to: "pudl-deployments"
          topic: "pudl-archiver"
          content: ${{ steps.launch_message.outputs.LAUNCH_CONTENT }}

  archive-run:
    needs: notify-start
    defaults:
      run:
        shell: bash -l {0}
    runs-on: ubuntu-latest
    # Browsers and their system libraries come preinstalled in this image, so
    # no apt/browser setup is needed. The tag must match the playwright version
    # pinned in pyproject.toml.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host --init
    env:
      DATASET: ${{ needs.notify-start.outputs.dataset }}
      DEPOSITION_PATH: ${{ inputs.deposition_path || 'gs://archives.catalyst.coop' }}
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v7

      # The workspace is owned by a different user inside the container, so git
      # refuses to operate on it without this.
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set default GCP credentials
        id: gcloud-auth
        continue-on-error: true
        uses: "google-github-actions/auth@v3"
        with:
          workload_identity_provider: "projects/345950277072/locations/global/workloadIdentityPools/gh-actions-pool/providers/gh-actions-provider"
          service_account: "pudl-archiver-gha@catalyst-cooperative-pudl.iam.gserviceaccount.com"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Log the pixi environment
        run: |
          pixi info
          pixi list

      - name: Run production archiver for ${{ env.DATASET }}
        # set -o pipefail passes on any failure codes to the next step,
        # enabling us to see whether or not the pudl_archiver run failed.
        run: |
          set -o pipefail
          pixi run pudl_archiver \
            archive \
            fsspec \
            "$DATASET" \
            "$DEPOSITION_PATH"/"$DATASET" \
            --clobber-unchanged 2>&1 | tee "${DATASET}_log.txt"

      - name: Save failed runs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: error-log-${{ env.DATASET }}
          path: ${{ env.DATASET }}_log.txt

      - name: Upload run summaries
        if: always()
        id: upload_summaries
        uses: actions/upload-artifact@v7
        with:
          name: run-summaries-${{ env.DATASET }}
          path: ${{ env.DATASET }}_run_summary.json

  post-archive:
    # Create the Zenodo metadata draft, notify Zulip and open the GitHub issue.
    needs:
      - notify-start
      - archive-run
    if: ${{ always() }}
    uses: ./.github/workflows/fsspec-post-archive.yml
    with:
      dataset: ${{ needs.notify-start.outputs.dataset }}
      deposition_path: ${{ inputs.deposition_path || 'gs://archives.catalyst.coop' }}
      create_metadata_draft: ${{ needs.archive-run.result == 'success' && needs.notify-start.outputs.dataset == 'ferceqr' }}
      create_github_issue: ${{ github.event_name == 'schedule' || inputs.create_github_issue == true }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      issues: write
