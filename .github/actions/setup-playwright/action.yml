name: Set up Playwright
description: Install Playwright system dependencies and (cached) browsers. Requires pixi to be set up already.

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
        # On a lockfile change, start from the latest cache; the install step
        # below then only downloads browser revisions that are missing.
        restore-keys: |
          playwright-${{ runner.os }}-

    # System packages aren't covered by the browser cache, but installing them
    # in a single apt invocation is much faster than once per browser.
    - name: Install Playwright system dependencies
      shell: bash -l {0}
      run: pixi run playwright install-deps webkit chromium

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash -l {0}
      run: pixi run playwright install webkit chromium
